<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="HUMP">
<meta name="theme-color" content="#F5F4F2">
<link rel="apple-touch-icon" href="apple-touch-icon%20(1).png">
<link rel="icon" href="icon-512%20(1).png">
<title>HUMP</title>
<style>
html,body{margin:0;height:100%;background:#F5F4F2;font-family:system-ui,sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;padding-top:env(safe-area-inset-top);box-sizing:border-box;background:#F5F4F2}
p{padding:40px 20px;text-align:center;color:#6F665E}
</style>
</head>
<body>
<script>
// الرابط حق السكربت (بدون المفتاح). المفتاح يجي من رابط الصفحة نفسها ?key=...
const APP='https://script.google.com/macros/s/AKfycby-aUm77zT3wKfsirlNhl5tcMoiOaFUH680G_MbZMbET6nSBk287gtvUPckh-cQyVWR/exec';
const key=new URLSearchParams(location.search).get('key');
if(!key){document.body.innerHTML='<p>افتح الصفحة بالرابط اللي فيه المفتاح.</p>'}
else{const f=document.createElement('iframe');f.src=APP+'?key='+encodeURIComponent(key);f.allow='clipboard-write';document.body.appendChild(f)}
</script>
</body>
</html>
